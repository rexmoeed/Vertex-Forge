name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for manual release (e.g. v1.4.0)'
        required: true
        default: 'v1.4.0'

permissions:
  contents: write

jobs:
  package-and-release:
    name: Package and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Quality Gates
        run: |
          npm run typecheck
          npm run lint
          npm run test

      - name: Build Production Distribution
        run: npm run build

      - name: Create Release Distribution Tarball
        run: |
          tar -czf vertex-forge-dist.tar.gz dist/ package.json README.md LICENSE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        with:
          name: Vertex Forge ${{ github.ref_name || github.event.inputs.tag_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            vertex-forge-dist.tar.gz
